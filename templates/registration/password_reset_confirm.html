{% extends 'base.html' %}
{% block title %}Nova Senha{% endblock %}

{% block content %}
<div class="form-card" style="max-width:560px;">
  <h2>✅ Definir nova senha</h2>
  {% if validlink %}
  <form method="post" style="display:grid;gap:0.75rem;">
    {% csrf_token %}
    <label>
      Nova senha
      {{ form.new_password1 }}
    </label>
    <label>
      Confirmar nova senha
      {{ form.new_password2 }}
    </label>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Salvar nova senha</button>
    </div>
  </form>
  {% else %}
  <p style="color:var(--vermelho);">Este link é inválido ou expirou. Solicite uma nova redefinição.</p>
  <div class="form-actions">
    <a href="{% url 'password_reset' %}" class="btn btn-outline">Solicitar novo link</a>
  </div>
  {% endif %}
</div>
{% endblock %}
