{% extends 'base.html' %}
{% block title %}Redefinir Senha{% endblock %}

{% block content %}
<div class="page-header">
  <h1>🔐 Redefinir <span>Senha</span></h1>
  <a href="{% url 'atleta_login' %}" class="btn btn-outline">← Voltar ao Login</a>
</div>

<div class="form-card" style="max-width:560px;">
  <h2>Recuperação por E-mail</h2>
  <p style="color:var(--cinza);font-size:0.92rem;">
    Informe o e-mail usado no cadastro. Você receberá um link para criar uma nova senha.
  </p>
  <form method="post" style="display:grid;gap:0.75rem;">
    {% csrf_token %}
    <label>
      E-mail
      {{ form.email }}
    </label>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Enviar link de redefinição</button>
    </div>
  </form>
</div>
{% endblock %}
