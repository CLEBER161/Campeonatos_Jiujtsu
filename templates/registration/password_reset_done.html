{% extends 'base.html' %}
{% block title %}E-mail Enviado{% endblock %}

{% block content %}
<div class="form-card" style="max-width:620px;">
  <h2>📨 Link enviado</h2>
  <p style="color:var(--cinza);font-size:0.94rem;">
    Se o e-mail informado existir no sistema, enviamos um link de redefinição.
  </p>
  <p style="color:var(--cinza);font-size:0.94rem;">
    No ambiente atual, o e-mail aparece no terminal do servidor Django.
  </p>
  <div class="form-actions">
    <a href="{% url 'atleta_login' %}" class="btn btn-outline">Voltar ao login</a>
  </div>
</div>
{% endblock %}
