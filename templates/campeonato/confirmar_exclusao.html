{% extends 'base.html' %}
{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
<div class="confirm-card">
  <div class="icon">⚠️</div>
  <h2>Confirmar Exclusão</h2>
  <p>Deseja realmente excluir <strong>{{ objeto }}</strong>? Esta ação não pode ser desfeita.</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions" style="display:flex; gap:1rem; justify-content:center;">
      <button type="submit" class="btn btn-danger">Sim, excluir</button>
      <a href="javascript:history.back()" class="btn btn-outline">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
